name: Captain OS CodeQL

on:
  pull_request:
    paths:
      - "captain-os-readonly/**"
      - ".github/workflows/captain-os-codeql.yml"
  push:
    branches:
      - main
    paths:
      - "captain-os-readonly/**"
      - ".github/workflows/captain-os-codeql.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          source-root: captain-os-readonly

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:python"
