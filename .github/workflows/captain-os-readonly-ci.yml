name: Captain OS Read-Only CI

on:
  push:
    branches: ["review/captain-os-readonly-v0.2"]
    paths:
      - "captain-os-readonly/**"
      - ".github/workflows/captain-os-readonly-ci.yml"
  pull_request:
    paths:
      - "captain-os-readonly/**"
      - ".github/workflows/captain-os-readonly-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: captain-os-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Critical static checks
        run: ruff check src tests scripts evals --select F,E9
      - run: pytest -q
      - name: Key-free retrieval evaluations
        run: python evals/run_local.py
      - run: python -m compileall -q src scripts evals
